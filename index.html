<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#f3ead4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- `default` = opaque bar with DARK glyphs. `black-translucent` (used here
         before the Marble & Gold redesign) forces LIGHT glyphs, which on the
         parchment HUD left the clock and battery nearly invisible. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Electric Cats" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <!-- Cinzel (carved-stone headings) / Spectral (body) / JetBrains Mono (every
         number and readout) are BUNDLED via @fontsource — imported in main.tsx,
         not fetched from Google. A native app launched offline would otherwise
         render entirely in Georgia. -->
    <title>Electric Cats</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
